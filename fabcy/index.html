<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Scheda Allenamento – Fancy</title>

<style>
body{
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.giorno{
  background:#fff;
  border-radius:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  margin-bottom:16px;
}

.giorno-header{
  padding:12px 16px;
  font-weight:600;
  cursor:pointer;
  background:#222;
  color:#fff;
  border-radius:10px 10px 0 0;
}

.esercizi{
  padding:10px;
}

.esercizio{
  display:grid;
  grid-template-columns: 1.5fr repeat(4, .7fr) auto;
  gap:6px;
  align-items:center;
  margin-bottom:6px;
  padding:6px;
  border-radius:6px;
  background:#f9fafb;
  cursor:grab;
}

.esercizio input{
  padding:4px 6px;
  font-size:13px;
}

.esercizio button{
  background:#e74c3c;
  border:none;
  color:#fff;
  border-radius:4px;
  cursor:pointer;
}

.controls{
  display:flex;
  gap:6px;
  margin:20px 0;
  flex-wrap:wrap;
}

.controls input, .controls select{
  padding:6px;
  font-size:14px;
}

.controls button{
  padding:6px 10px;
  background:#2ecc71;
  border:none;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
}

.pet{background:#ffe5e5;}
.spalle{background:#e5f0ff;}
.braccia{background:#fff2e0;}
.postura{background:#e6ffe9;}
</style>
</head>

<body>

<h1>Scheda Allenamento – Fancy</h1>

<div class="controls">
  <input id="newDayName" placeholder="Nome nuovo giorno">
  <button onclick="addDay()">+ Giorno</button>
</div>

<div id="scheda"></div>

<div class="controls">
  <select id="daySelect"></select>
  <input id="exName" placeholder="Esercizio">
  <input id="exSerie" placeholder="Serie">
  <input id="exRep" placeholder="Rep">
  <input id="exRec" placeholder="Rec">
  <input id="exCarico" placeholder="Carico">
  <select id="exGroup">
    <option value="pet">Petto</option>
    <option value="spalle">Spalle</option>
    <option value="braccia">Braccia</option>
    <option value="postura">Postura</option>
  </select>
  <button onclick="addExercise()">+ Esercizio</button>
</div>

<script>
const STORAGE_KEY = "scheda_fancy_v1";

const defaultData = {
 "Giorno A – Petto + Spalle + Postura":[
  {n:"Panca piana bilanciere",s:"4",r:"8",re:"2'",c:"72,5kg",g:"pet"},
  {n:"Croci manubri inclinata",s:"4",r:"12",re:"90\"",c:"16kg",g:"pet"},
  {n:"Face pull",s:"4",r:"12",re:"90\"",c:"50kg",g:"postura"},
  {n:"Alzate laterali",s:"4",r:"12",re:"60\"",c:"12kg",g:"spalle"}
 ],
 "Giorno B – Schiena + Richiamo":[
  {n:"Lat machine",s:"4",r:"8",re:"90\"",c:"59kg",g:"braccia"},
  {n:"Rear delt",s:"4",r:"12",re:"60\"",c:"45kg",g:"postura"}
 ],
 "Giorno C – Braccia + Petto":[
  {n:"Spinte manubri inclinata",s:"4",r:"8",re:"90\"",c:"26kg",g:"pet"},
  {n:"Serratus punch",s:"3",r:"15",re:"60\"",c:"23kg",g:"postura"}
 ]
};

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData;

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function render(){
  const container = document.getElementById("scheda");
  const daySelect = document.getElementById("daySelect");
  container.innerHTML = "";
  daySelect.innerHTML = "";

  Object.keys(data).forEach(day=>{
    daySelect.innerHTML += `<option>${day}</option>`;

    const dayDiv = document.createElement("div");
    dayDiv.className = "giorno";

    const header = document.createElement("div");
    header.className = "giorno-header";
    header.textContent = day;
    header.onclick = ()=> body.classList.toggle("hidden");

    const body = document.createElement("div");
    body.className = "esercizi";

    data[day].forEach((e,i)=>{
      const row = document.createElement("div");
      row.className = `esercizio ${e.g}`;
      row.draggable = true;

      row.innerHTML = `
        <input value="${e.n}" onchange="edit('${day}',${i},'n',this.value)">
        <input value="${e.s}" onchange="edit('${day}',${i},'s',this.value)">
        <input value="${e.r}" onchange="edit('${day}',${i},'r',this.value)">
        <input value="${e.re}" onchange="edit('${day}',${i},'re',this.value)">
        <input value="${e.c}" onchange="edit('${day}',${i},'c',this.value)">
        <button onclick="removeEx('${day}',${i})">✕</button>
      `;
      body.appendChild(row);
    });

    dayDiv.append(header, body);
    container.appendChild(dayDiv);
  });
}

function edit(day,i,k,v){ data[day][i][k]=v; save(); }
function removeEx(day,i){ data[day].splice(i,1); save(); render(); }

function addDay(){
  const name = document.getElementById("newDayName").value.trim();
  if(!name) return;
  data[name]=[];
  save(); render();
  document.getElementById("newDayName").value="";
}

function addExercise(){
  const d = document.getElementById("daySelect").value;
  data[d].push({
    n:exName.value,s:exSerie.value,r:exRep.value,
    re:exRec.value,c:exCarico.value,g:exGroup.value
  });
  save(); render();
}

render();
</script>

</body>
</html>
