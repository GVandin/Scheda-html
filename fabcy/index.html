<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheda Allenamento</title>

<style>
body{
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:#f2f4f7;
  margin:0;
  padding:12px;
}

h1{
  text-align:center;
  font-size:20px;
  margin:10px 0 16px;
}

/* GIORNI */
.giorno{
  background:#fff;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
  margin-bottom:14px;
  overflow:hidden;
}

.giorno-header{
  padding:14px;
  font-weight:700;
  background:#111;
  color:#fff;
  cursor:pointer;
}

.esercizi{
  padding:10px;
}

/* ESERCIZIO CARD */
.esercizio{
  background:#fafafa;
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

/* INPUT */
.esercizio input{
  padding:8px;
  font-size:14px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* GRIGLIA CAMPI */
.row{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:6px;
}

/* BOTTONI */
.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:4px;
}

.actions button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  font-size:14px;
  cursor:pointer;
}

.delete{
  background:#e74c3c;
  color:#fff;
}

.add{
  background:#2ecc71;
  color:#fff;
  width:100%;
}

/* CONTROLLI */
.controls{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin:16px 0;
}

.controls input, .controls select{
  padding:10px;
  font-size:15px;
  border-radius:8px;
  border:1px solid #bbb;
}

/* DESKTOP */
@media(min-width:768px){
  body{max-width:900px;margin:auto}
}
</style>
</head>

<body>

<h1>Scheda Allenamento</h1>

<div class="controls">
  <input id="newDay" placeholder="Nuovo giorno">
  <button class="add" onclick="addDay()">➕ Aggiungi giorno</button>
</div>

<div id="scheda"></div>

<div class="controls">
  <select id="daySelect"></select>
  <input id="name" placeholder="Esercizio">
  <div class="row">
    <input id="serie" placeholder="Serie">
    <input id="rep" placeholder="Ripetizioni">
    <input id="rec" placeholder="Recupero">
    <input id="carico" placeholder="Carico">
  </div>
  <button class="add" onclick="addExercise()">➕ Aggiungi esercizio</button>
</div>

<script>
const KEY = "scheda_mobile_v1";

const defaultData = JSON.parse(localStorage.getItem(KEY)) || {
 "Giorno A":[
  {n:"Panca piana bilanciere",s:"4",r:"8",re:"2'",c:"72,5kg"},
  {n:"Croci manubri inclinata",s:"4",r:"12",re:"90\"",c:"16kg"},
  {n:"Face pull",s:"4",r:"12",re:"90\"",c:"50kg"},
  {n:"Alzate laterali",s:"4",r:"12",re:"12kg"}
 ],
 "Giorno B":[
  {n:"Lat machine",s:"4",r:"8",re:"90\"",c:"59kg"},
  {n:"Rear delt machine",s:"4",r:"12",re:"60\"",c:"45kg"}
 ],
 "Giorno C":[
  {n:"Spinte manubri inclinata",s:"4",r:"8",re:"90\"",c:"26kg"},
  {n:"Serratus punch",s:"3",r:"15",re:"60\"",c:"23kg"}
 ]
};

let data = defaultData;

function save(){
  localStorage.setItem(KEY, JSON.stringify(data));
}

function render(){
  const s = document.getElementById("scheda");
  const sel = document.getElementById("daySelect");
  s.innerHTML="";
  sel.innerHTML="";

  Object.keys(data).forEach(day=>{
    sel.innerHTML+=`<option>${day}</option>`;

    const d = document.createElement("div");
    d.className="giorno";

    const h = document.createElement("div");
    h.className="giorno-header";
    h.textContent=day;

    const b = document.createElement("div");
    b.className="esercizi";

    h.onclick=()=>b.style.display=b.style.display==="none"?"block":"none";

    data[day].forEach((e,i)=>{
      const ex=document.createElement("div");
      ex.className="esercizio";
      ex.innerHTML=`
        <input value="${e.n}" onchange="edit('${day}',${i},'n',this.value)">
        <div class="row">
          <input value="${e.s}" onchange="edit('${day}',${i},'s',this.value)">
          <input value="${e.r}" onchange="edit('${day}',${i},'r',this.value)">
          <input value="${e.re}" onchange="edit('${day}',${i},'re',this.value)">
          <input value="${e.c}" onchange="edit('${day}',${i},'c',this.value)">
        </div>
        <div class="actions">
          <button class="delete" onclick="removeEx('${day}',${i})">✕ Elimina</button>
        </div>
      `;
      b.appendChild(ex);
    });

    d.append(h,b);
    s.appendChild(d);
  });
}

function edit(d,i,k,v){data[d][i][k]=v;save();}
function removeEx(d,i){data[d].splice(i,1);save();render();}
function addDay(){const n=newDay.value.trim();if(!n)return;data[n]=[];save();render();newDay.value="";}
function addExercise(){
  const d=daySelect.value;
  data[d].push({n:name.value,s:serie.value,r:rep.value,re:rec.value,c:carico.value});
  save();render();
}

render();
</script>

</body>
</html>
