<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheda Allenamento</title>

<!-- SORTABLE JS -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
body{
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:#f2f4f7;
  margin:0;
  padding:12px;
}

h1{
  text-align:center;
  font-size:20px;
  margin:10px 0 16px;
}

.giorno{
  background:#fff;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
  margin-bottom:14px;
  overflow:hidden;
}

.giorno-header{
  padding:14px;
  font-weight:700;
  background:#111;
  color:#fff;
  cursor:pointer;
}

.esercizi{
  padding:10px;
}

.esercizio{
  background:#fafafa;
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
  display:flex;
  flex-direction:column;
  gap:6px;
  touch-action: manipulation;
}

.drag{
  text-align:center;
  font-size:18px;
  cursor:grab;
}

.esercizio input{
  padding:8px;
  font-size:14px;
  border-radius:6px;
  border:1px solid #ccc;
}

.row{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:6px;
}

.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.delete{
  background:#e74c3c;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:6px 10px;
  font-size:14px;
}

.add{
  background:#2ecc71;
  color:#fff;
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  font-size:15px;
  cursor:pointer;
}

.controls{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin:16px 0;
}

.controls input, .controls select{
  padding:10px;
  font-size:15px;
  border-radius:8px;
  border:1px solid #bbb;
}

@media(min-width:768px){
  body{max-width:900px;margin:auto}
}
</style>
</head>

<body>

<h1>Scheda Allenamento</h1>

<div class="controls">
  <input id="newDay" placeholder="Nuovo giorno">
  <button class="add" onclick="addDay()">➕ Aggiungi giorno</button>
</div>

<div id="scheda"></div>

<div class="controls">
  <select id="daySelect"></select>
  <input id="name" placeholder="Esercizio">
  <div class="row">
    <input id="serie" placeholder="Serie">
    <input id="rep" placeholder="Ripetizioni">
    <input id="rec" placeholder="Recupero">
    <input id="carico" placeholder="Carico">
  </div>
  <button class="add" onclick="addExercise()">➕ Aggiungi esercizio</button>
</div>

<script>
const KEY = "scheda_fancy_drag_v1";

const data = JSON.parse(localStorage.getItem(KEY)) || {

"GIORNO A – PETTO + SPALLE + POSTURA": [
 {n:"Panca piana bilanciere",s:"4",r:"8",re:"2'",c:"72,5 kg"},
 {n:"Croci manubri panca inclinata",s:"4",r:"12",re:"90\"",c:"16 kg"},
 {n:"Face pull",s:"4",r:"12",re:"90\"",c:"50 kg"},
 {n:"Alzate laterali manubri",s:"4",r:"12",re:"60\"",c:"12 kg"},
 {n:"Rear delts machine / cavi",s:"4",r:"12",re:"60\"",c:"45–47 kg"},
 {n:"Shoulder press bilanciere in piedi",s:"4",r:"10",re:"120\"",c:"30 kg"},
 {n:"Extrarotazioni gomiti addotti",s:"3",r:"10–12",re:"60\"",c:"9 kg"},
 {n:"Extrarotazioni in abduzione",s:"3",r:"10–12",re:"60\"",c:"7 kg"}
],

"GIORNO B – SCHIENA + SPALLE + RICHIAMO PETTO": [
 {n:"Lat pulldown presa prona",s:"4",r:"8",re:"90\"",c:"59 kg"},
 {n:"Rematore manubrio / Long pull",s:"4",r:"8",re:"90\"",c:"27,5 / 50–54 kg"},
 {n:"Rear delts machine / cavi",s:"4",r:"12",re:"60\"",c:"45–47 kg"},
 {n:"Face pull",s:"4",r:"12",re:"90\"",c:"50 kg"},
 {n:"Alzate laterali manubri",s:"4",r:"12",re:"60\"",c:"12 kg"},
 {n:"Croci manubri panca poco inclinata",s:"1",r:"12–15",re:"—",c:"12–14 kg"}
],

"GIORNO C – BRACCIA + SPALLE + PETTO": [
 {n:"Curl manubri in piedi",s:"4",r:"12",re:"60\"",c:"12 kg"},
 {n:"Pushdown tricipiti ai cavi",s:"4",r:"12",re:"60\"",c:"~32 kg"},
 {n:"Spinte manubri seduto (spalle)",s:"4",r:"10–12",re:"90\"",c:"14 kg"},
 {n:"Spinte manubri panca inclinata",s:"4",r:"8",re:"90\"",c:"26 kg"},
 {n:"Croci ai cavi (basse)",s:"3–4",r:"12–15",re:"60\"",c:"progressivo"},
 {n:"Serratus punch ai cavi",s:"3",r:"12–15",re:"60\"",c:"23 kg"}
]

};

function save(){ localStorage.setItem(KEY, JSON.stringify(data)); }

function render(){
  const s=document.getElementById("scheda");
  const sel=document.getElementById("daySelect");
  s.innerHTML=""; sel.innerHTML="";

  Object.keys(data).forEach(day=>{
    sel.innerHTML+=`<option>${day}</option>`;

    const d=document.createElement("div");
    d.className="giorno";

    const h=document.createElement("div");
    h.className="giorno-header";
    h.textContent=day;

    const b=document.createElement("div");
    b.className="esercizi";

    h.onclick=()=>b.style.display=b.style.display==="none"?"block":"none";

    data[day].forEach((e,i)=>{
      const ex=document.createElement("div");
      ex.className="esercizio";
      ex.dataset.index=i;
      ex.innerHTML=`
        <div class="drag">☰</div>
        <input value="${e.n}" onchange="edit('${day}',${i},'n',this.value)">
        <div class="row">
          <input value="${e.s}" onchange="edit('${day}',${i},'s',this.value)">
          <input value="${e.r}" onchange="edit('${day}',${i},'r',this.value)">
          <input value="${e.re}" onchange="edit('${day}',${i},'re',this.value)">
          <input value="${e.c}" onchange="edit('${day}',${i},'c',this.value)">
        </div>
        <div class="actions">
          <span>Trascina ↑↓</span>
          <button class="delete" onclick="removeEx('${day}',${i})">✕</button>
        </div>
      `;
      b.appendChild(ex);
    });

    d.append(h,b);
    s.appendChild(d);

    new Sortable(b,{
      animation:150,
      handle:".drag",
      onEnd:e=>{
        const arr=data[day];
        const [m]=arr.splice(e.oldIndex,1);
        arr.splice(e.newIndex,0,m);
        save(); render();
      }
    });
  });
}

function edit(d,i,k,v){data[d][i][k]=v;save();}
function removeEx(d,i){data[d].splice(i,1);save();render();}
function addDay(){const n=newDay.value.trim();if(!n)return;data[n]=[];save();render();newDay.value="";}
function addExercise(){
  const d=daySelect.value;
  data[d].push({n:name.value,s:serie.value,r:rep.value,re:rec.value,c:carico.value});
  save();render();
}

render();
</script>

</body>
</html>
