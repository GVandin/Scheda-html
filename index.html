<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scheda Allenamento</title>

  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 16px;
      background: #f0f2f5;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .giorno {
      margin-bottom: 20px;
    }

    .giorno-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .giorno-header h2 {
      font-size: 18px;
      margin: 0;
      color: #222;
    }

    .btn-add-esercizio {
      background: #1e90ff;
      color: white;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .card-container {
      margin-top: 10px;
      display: none; /* chiuso di default */
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      word-wrap: break-word;
      transition: transform 0.1s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
    }

    .nome {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 10px;
      color: #111;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .field {
      flex: 1;
    }

    .field label {
      font-size: 12px;
      color: #555;
      display: block;
      margin-bottom: 2px;
    }

    .field input {
      width: 100%;
      padding: 6px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button.remove {
      background: #e74c3c;
      color: white;
      width: 100%;
      margin-top: 6px;
    }

    button.add-giorno {
      background: #28a745;
      color: white;
      margin-bottom: 20px;
      width: 100%;
      font-size: 16px;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .row {
        flex-direction: column;
      }
      .field input {
        font-size: 16px;
        padding: 8px;
      }
      button.add-giorno {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<h1>Scheda Allenamento</h1>
<button class="add-giorno" id="btn-add-giorno">+ Aggiungi Giorno</button>
<div id="app"></div>

<script>
  const initialData = [
    {
      nome: "Giorno A",
      esercizi: [
        { nome: "Panca piana bilanciere", serie: 4, rip: 8, rec: 90, kg: 72.5 },
        { nome: "Croci manubri panca inclinata", serie: 4, rip: 12, rec: 60, kg: 16 }
      ]
    },
    {
      nome: "Giorno B",
      esercizi: [
        { nome: "Lat pulldown presa prona", serie: 4, rip: 8, rec: 90, kg: 59 },
        { nome: "Rematore alternato manubri", serie: 4, rip: 8, rec: 90, kg: 27.5 }
      ]
    },
    {
      nome: "Giorno C",
      esercizi: [
        { nome: "Curl manubri in piedi", serie: 4, rip: 12, rec: 60, kg: 12 },
        { nome: "Pushdown tricipiti ai cavi", serie: 4, rip: 12, rec: 60, kg: 32 }
      ]
    }
  ];

  let giorni = JSON.parse(localStorage.getItem("scheda")) || initialData;

  function salva() {
    localStorage.setItem("scheda", JSON.stringify(giorni));
  }

  function render() {
    const app = document.getElementById("app");
    app.innerHTML = "";

    giorni.forEach((giorno, gIndex) => {
      const div = document.createElement("div");
      div.className = "giorno";

      const header = document.createElement("div");
      header.className = "giorno-header";

      const titolo = document.createElement("h2");
      titolo.textContent = giorno.nome;

      const btnAdd = document.createElement("button");
      btnAdd.textContent = "+ Aggiungi esercizio";
      btnAdd.className = "btn-add-esercizio";
      btnAdd.onclick = ev => {
        ev.stopPropagation();
        const nome = prompt("Nome esercizio:");
        if (!nome) return;
        giorno.esercizi.push({ nome, serie: 3, rip: 10, rec: 60, kg: 0 });
        salva();
        render();
      };

      header.appendChild(titolo);
      header.appendChild(btnAdd);
      div.appendChild(header);

      // Contenitore card collapsabile
      const cardContainer = document.createElement("div");
      cardContainer.className = "card-container";

      giorno.esercizi.forEach((e, eIndex) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="nome">${e.nome}</div>

          <div class="row">
            <div class="field">
              <label>Serie</label>
              <input type="number" value="${e.serie}">
            </div>
            <div class="field">
              <label>Rip</label>
              <input type="number" value="${e.rip}">
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label>Rec (s)</label>
              <input type="number" value="${e.rec}">
            </div>
            <div class="field">
              <label>Kg</label>
              <input type="number" value="${e.kg}">
            </div>
          </div>

          <button class="remove">Elimina esercizio</button>
        `;

        const inputs = card.querySelectorAll("input");
        inputs[0].oninput = ev => { e.serie = +ev.target.value; salva(); };
        inputs[1].oninput = ev => { e.rip = +ev.target.value; salva(); };
        inputs[2].oninput = ev => { e.rec = +ev.target.value; salva(); };
        inputs[3].oninput = ev => { e.kg = +ev.target.value; salva(); };

        card.querySelector(".remove").onclick = () => {
          giorno.esercizi.splice(eIndex, 1);
          salva();
          render();
        };

        cardContainer.appendChild(card);
      });

      div.appendChild(cardContainer);

      // Toggle apertura/chiusura giorno
      header.onclick = () => {
        if (cardContainer.style.display === "none") {
          cardContainer.style.display = "block";
        } else {
          cardContainer.style.display = "none";
        }
      };

      app.appendChild(div);
    });
  }

  // Pulsante aggiungi giorno
  document.getElementById("btn-add-giorno").onclick = () => {
    const nomeGiorno = prompt("Nome nuovo giorno (es. Giorno D):");
    if (!nomeGiorno) return;
    giorni.push({ nome: nomeGiorno, esercizi: [] });
    salva();
    render();
  };

  render();
</script>

</body>
</html>
