<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Scheda Allenamento Definitiva</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background:#f9f9f9; }
h1 { text-align:center; margin-bottom:20px; }
.giorno h2 {
  cursor: pointer;
  background: #4CAF50;
  color: white;
  padding: 10px 12px;
  border-radius: 4px;
  margin: 0;
}
ul { list-style: none; padding: 0; margin: 0 0 15px 0; }
li {
  margin: 5px 0;
  padding: 10px;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 4px;
  cursor: grab;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}
li.dragging { opacity: 0.5; background: #e0e0e0; }
li input { width: 120px; padding: 3px; }
button { padding: 2px 5px; }
.giorno ul { max-width: 700px; margin: 0 auto; }
.add-container { margin-bottom: 20px; text-align:center; }
input[type=text] { padding:5px; margin-right:5px; width:150px; }
</style>
</head>
<body>

<h1>Scheda Allenamento Definitiva</h1>

<div class="add-container">
  <input type="text" id="nuovoGiornoNome" placeholder="Nome nuovo giorno">
  <button id="aggiungiGiorno">Aggiungi Giorno</button>
</div>

<div id="schedaContainer"></div>

<div class="add-container">
  <select id="giornoSelezionato"></select>
  <input type="text" id="nomeEsercizio" placeholder="Nome esercizio">
  <input type="text" id="serieEsercizio" placeholder="Serie">
  <input type="text" id="repEsercizio" placeholder="Ripetizioni">
  <input type="text" id="recuperoEsercizio" placeholder="Recupero">
  <input type="text" id="caricoEsercizio" placeholder="Carico">
  <button id="aggiungiEsercizio">Aggiungi Esercizio</button>
</div>

<script>
// ================= Dati iniziali =================
const schedaContainer = document.getElementById("schedaContainer");
const giornoSelect = document.getElementById("giornoSelezionato");

// Esercizi iniziali
const giorniIniziali = {
  "Giorno A – Petto + Spalle + Postura": [
    {nome:"Panca piana bilanciere", serie:"4", rep:"8", recupero:"2min", carico:"72,5kg"},
    {nome:"Croci manubri panca inclinata", serie:"4", rep:"12", recupero:"90s", carico:"16kg"},
    {nome:"Croci ai cavi alte", serie:"3", rep:"12–15", recupero:"60s", carico:"moderato"},
    {nome:"Face pull ai cavi", serie:"4", rep:"12", recupero:"90s", carico:"50kg"},
    {nome:"Alzate laterali manubri", serie:"4", rep:"12", recupero:"60s", carico:"12kg"},
    {nome:"Rear delts machine / cavi", serie:"4", rep:"12", recupero:"60s", carico:"45–47kg"},
    {nome:"Shoulder press bilanciere in piedi", serie:"4", rep:"10", recupero:"90s", carico:"30kg"},
    {nome:"Cuffia dei rotatori – extrarotazioni", serie:"3", rep:"10–12", recupero:"60s", carico:"7–9kg"}
  ],
  "Giorno B – Schiena + Spalle + Richiamo Petto": [
    {nome:"Lat pulldown presa prona", serie:"4", rep:"8", recupero:"90s", carico:"59kg"},
    {nome:"Rematore manubri / long pull ai cavi", serie:"4", rep:"8", recupero:"90s", carico:"27,5–50kg"},
    {nome:"Rear delts machine / cavi", serie:"4", rep:"12", recupero:"60s", carico:"45–47kg"},
    {nome:"Face pull ai cavi", serie:"4", rep:"12", recupero:"90s", carico:"50kg"},
    {nome:"Alzate laterali manubri", serie:"4", rep:"12", recupero:"60s", carico:"12kg"},
    {nome:"Richiamo petto – croci manubri panca poco inclinata", serie:"1", rep:"12–15", recupero:"60s", carico:"12–14kg"}
  ],
  "Giorno C – Braccia + Spalle + Petto + Postura": [
    {nome:"Curl manubri in piedi", serie:"4", rep:"12", recupero:"60s", carico:"12kg"},
    {nome:"Pushdown tricipiti ai cavi", serie:"4", rep:"12", recupero:"60s", carico:"32kg"},
    {nome:"Spinte manubri seduto (spalle)", serie:"4", rep:"10–12", recupero:"60s", carico:"14kg"},
    {nome:"Spinte manubri panca inclinata (petto)", serie:"4", rep:"8", recupero:"90s", carico:"26kg"},
    {nome:"Croci ai cavi basse", serie:"3", rep:"12–15", recupero:"60s", carico:"moderato"},
    {nome:"Serratus punch ai cavi", serie:"3", rep:"12–15", recupero:"60s", carico:"23kg"}
  ]
};

// ================= Funzioni =================
function creaLiEsercizio(e){
  const li=document.createElement('li'); li.draggable=true;

  const nomeInput=document.createElement('input'); nomeInput.value=e.nome; nomeInput.placeholder="Nome";
  const serieInput=document.createElement('input'); serieInput.value=e.serie; serieInput.placeholder="Serie";
  const repInput=document.createElement('input'); repInput.value=e.rep; repInput.placeholder="Ripetizioni";
  const recInput=document.createElement('input'); recInput.value=e.recupero; recInput.placeholder="Recupero";
  const caricoInput=document.createElement('input'); caricoInput.value=e.carico; caricoInput.placeholder="Carico";

  const delBtn=document.createElement('button'); delBtn.textContent="❌";
  delBtn.addEventListener('click', ()=>{
    li.remove();
    salvaGiorno(li.closest('.giorno').id);
  });

  [nomeInput, serieInput, repInput, recInput, caricoInput].forEach(input=>{
    input.addEventListener('input', ()=>{
      salvaGiorno(li.closest('.giorno').id);
    });
  });

  li.append(nomeInput, serieInput, repInput, recInput, caricoInput, delBtn);
  return li;
}

function creaGiorno(nome, esercizi){
  const div=document.createElement('div'); div.classList.add('giorno'); div.id=nome.replace(/\s+/g,'');
  const h2=document.createElement('h2'); h2.textContent=nome; div.appendChild(h2);
  const ul=document.createElement('ul');
  esercizi.forEach(e=> ul.appendChild(creaLiEsercizio(e)));
  div.appendChild(ul);
  schedaContainer.appendChild(div);

  // Collapsible
  h2.addEventListener('click', ()=>{ ul.style.display=(ul.style.display==='none')?'block':'none'; });
  aggiornaSelect();

  // Drag & Drop
  let draggedItem=null;
  ul.addEventListener('dragstart', e=>{ draggedItem=e.target; e.target.classList.add('dragging'); });
  ul.addEventListener('dragend', e=>{ e.target.classList.remove('dragging'); salvaGiorno(div.id); });
  ul.addEventListener('dragover', e=>{ e.preventDefault(); const after=getDragAfterElement(ul,e.clientY); if(after==null) ul.appendChild(draggedItem); else ul.insertBefore(draggedItem,after); });

  // Carica dati salvati
  const saved = JSON.parse(localStorage.getItem(div.id)||"[]");
  if(saved.length>0){
    ul.innerHTML="";
    saved.forEach(e=> ul.appendChild(creaLiEsercizio(e)));
  }
}

function getDragAfterElement(container,y){
  const draggableElements=[...container.querySelectorAll("li:not(.dragging)")];
  return draggableElements.reduce((closest,child)=>{
    const box=child.getBoundingClientRect();
    const offset=y-box.top-box.height/2;
    if(offset<0 && offset>closest.offset) return {offset:offset, element:child};
    else return closest;
  }, {offset:Number.NEGATIVE_INFINITY}).element;
}

function salvaGiorno(id){
  const ul=document.querySelector(`#${id} ul`);
  const data=Array.from(ul.children).map(li=>{
    const inputs=li.querySelectorAll('input');
    return {nome:inputs[0].value, serie:inputs[1].value, rep:inputs[2].value, recupero:inputs[3].value, carico:inputs[4].value};
  });
  localStorage.setItem(id, JSON.stringify(data));
}

function aggiornaSelect(){
  giornoSelect.innerHTML="";
  document.querySelectorAll('.giorno').forEach(g=>{
    const opt=document.createElement('option'); opt.value=g.id; opt.text=g.querySelector('h2').textContent;
    giornoSelect.appendChild(opt);
  });
}

// ================= Eventi aggiungi =================
document.getElementById("aggiungiGiorno").addEventListener('click', ()=>{
  const nome=document.getElementById("nuovoGiornoNome").value.trim();
  if(!nome) return alert("Inserisci un nome per il giorno");
  creaGiorno(nome,[]);
  document.getElementById("nuovoGiornoNome").value="";
});

document.getElementById("aggiungiEsercizio").addEventListener('click', ()=>{
  const giornoId=giornoSelect.value;
  const e={
    nome: document.getElementById("nomeEsercizio").value.trim(),
    serie: document.getElementById("serieEsercizio").value.trim(),
    rep: document.getElementById("repEsercizio").value.trim(),
    recupero: document.getElementById("recuperoEsercizio").value.trim(),
    carico: document.getElementById("caricoEsercizio").value.trim()
  };
  if(!e.nome) return alert("Inserisci il nome dell'esercizio");
  const ul=document.querySelector(`#${giornoId} ul`);
  ul.appendChild(creaLiEsercizio(e));
  salvaGiorno(giornoId);

  // Pulisce input
  document.getElementById("nomeEsercizio").value="";
  document.getElementById("serieEsercizio").value="";
  document.getElementById("repEsercizio").value="";
  document.getElementById("recuperoEsercizio").value="";
  document.getElementById("caricoEsercizio").value="";
});

// ================= Carica giorni iniziali =================
for(const g in giorniIniziali) creaGiorno(g,giorniIniziali[g]);
</script>

</body>
</html>
