<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Excel Swap - Fixed Grid</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f9fa; }
        .container { max-width: 100%; overflow-x: auto; text-align: center; }
        table { border-collapse: collapse; margin: 20px auto; background: white; table-layout: fixed; }
        td {
            width: 120px; height: 45px;
            border: 1px solid #ccc;
            text-align: center;
            cursor: grab;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        td.drag-over { background-color: #d1ecf1; border: 2px solid #0c5460; }
        .btn-group { margin-bottom: 20px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="btn-group">
        <input type="file" id="fileInput" accept=".xlsx, .xls" />
        <button id="exportBtn" style="display:none;">Esporta Modifiche</button>
    </div>
    <div id="tableContainer"></div>
</div>

<script>
    let draggedElement = null;

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            
            // 1. Otteniamo i dati come array di array
            const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

            // 2. Normalizziamo la griglia: troviamo la riga più lunga
            let maxCols = 0;
            jsonData.forEach(row => { if(row.length > maxCols) maxCols = row.length; });

            // 3. Generiamo la tabella forzando la larghezza di ogni riga
            let html = '<table id="targetTable">';
            jsonData.forEach(row => {
                html += '<tr>';
                for(let i = 0; i < maxCols; i++) {
                    let val = (row[i] !== undefined && row[i] !== "") ? row[i] : "&nbsp;";
                    html += `<td draggable="true">${val}</td>`;
                }
                html += '</tr>';
            });
            html += '</table>';
            
            document.getElementById('tableContainer').innerHTML = html;
            document.getElementById('exportBtn').style.display = 'inline-block';
            attachEvents();
        };
        reader.readAsArrayBuffer(file);
    });

    function attachEvents() {
        const cells = document.querySelectorAll('td');
        cells.forEach(cell => {
            cell.addEventListener('dragstart', (e) => {
                draggedElement = cell;
                e.dataTransfer.setData('text/html', cell.innerHTML);
            });
            cell.addEventListener('dragover', (e) => e.preventDefault());
            cell.addEventListener('dragenter', (e) => cell.classList.add('drag-over'));
            cell.addEventListener('dragleave', (e) => cell.classList.remove('drag-over'));
            cell.addEventListener('drop', function(e) {
                e.preventDefault();
                cell.classList.remove('drag-over');
                if (draggedElement !== this) {
                    // Swap atomico del contenuto
                    let temp = this.innerHTML;
                    this.innerHTML = draggedElement.innerHTML;
                    draggedElement.innerHTML = temp;
                }
            });
        });
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
        const table = document.getElementById('targetTable');
        const ws = XLSX.utils.table_to_sheet(table);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Dati");
        XLSX.writeFile(wb, "permutazione_excel.xlsx");
    });
</script>
</body>
</html>
