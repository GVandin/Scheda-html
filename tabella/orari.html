<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Scambio Orario Simmetrico</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        table { border-collapse: collapse; background: white; margin: auto; }
        td, th { border: 1px solid #999; width: 100px; height: 50px; text-align: center; }
        th { background: #2c3e50; color: white; }
        .docente-header { background: #dfe6e9; font-weight: bold; }
        .drop-zone { cursor: grab; }
        .drag-over { background: #74b9ff !important; }
        .controls { text-align: center; margin-bottom: 20px; }
        button { padding: 10px 20px; background: #27ae60; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="fileInput" accept=".xlsx, .xls" />
    <button id="exportBtn" style="display:none;">Esporta Excel</button>
</div>
<div id="tableContainer"></div>

<script>
    let draggedElement = null;
    const ORE_PER_DOCENTE = 6; // Modifica qui se i blocchi sono diversi

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
            renderTable(jsonData);
        };
        reader.readAsArrayBuffer(file);
    });

    function renderTable(data) {
        let html = '<table id="mainTable"><thead><tr><th>Docente</th><th>Ora</th><th>Lun</th><th>Mar</th><th>Mer</th><th>Gio</th><th>Ven</th><th>Sab</th></tr></thead><tbody>';
        
        data.forEach((row, rIdx) => {
            if (rIdx === 0) return; // Salta intestazione se presente
            html += `<tr data-row-index="${rIdx}">`;
            for (let cIdx = 0; cIdx < 8; cIdx++) {
                let content = row[cIdx] || "";
                let isDraggable = (cIdx >= 2);
                let attr = isDraggable ? `draggable="true" class="drop-zone"` : (cIdx === 0 && content !== "" ? `class="docente-header"` : "");
                html += `<td ${attr} data-col="${cIdx}">${content}</td>`;
            }
            html += '</tr>';
        });
        
        document.getElementById('tableContainer').innerHTML = html + '</tbody></table>';
        document.getElementById('exportBtn').style.display = 'inline';
        setupEvents();
    }

    function setupEvents() {
        const cells = document.querySelectorAll('.drop-zone');
        cells.forEach(cell => {
            cell.addEventListener('dragstart', (e) => {
                draggedElement = cell;
                cell.style.opacity = '0.4';
            });

            cell.addEventListener('dragend', () => {
                cell.style.opacity = '1';
                cells.forEach(c => c.classList.remove('drag-over'));
            });

            cell.addEventListener('dragover', e => e.preventDefault());
            cell.addEventListener('dragenter', e => cell.classList.add('drag-over'));
            cell.addEventListener('dragleave', e => cell.classList.remove('drag-over'));

            cell.addEventListener('drop', function(e) {
                e.preventDefault();
                if (draggedElement === this) return;

                const table = document.getElementById('mainTable');
                
                // 1. Identifica coordinate di partenza
                const fromRowIdx = parseInt(draggedElement.parentElement.getAttribute('data-row-index'));
                const fromColIdx = parseInt(draggedElement.getAttribute('data-col'));
                
                // 2. Identifica coordinate di arrivo
                const toRowIdx = parseInt(this.parentElement.getAttribute('data-row-index'));
                const toColIdx = parseInt(this.getAttribute('data-col'));

                // 3. Calcola i blocchi docenti (ogni 6 righe)
                // Usiamo (index - 1) perché la riga 0 dell'array è l'intestazione
                const fromDocenteBase = Math.floor((fromRowIdx - 1) / ORE_PER_DOCENTE) * ORE_PER_DOCENTE + 1;
                const toDocenteBase = Math.floor((toRowIdx - 1) / ORE_PER_DOCENTE) * ORE_PER_DOCENTE + 1;
                
                const fromOraRelativa = (fromRowIdx - 1) % ORE_PER_DOCENTE;
                const toOraRelativa = (toRowIdx - 1) % ORE_PER_DOCENTE;

                // 4. TROVA LA CELLA SIMMETRICA
                // Il collega deve ricevere la mia ora (fromOraRelativa) nel mio giorno (fromColIdx)
                // Ma nel SUO blocco docente.
                const cellaSimmetricaDelCollega = table.rows[toDocenteBase + fromOraRelativa].cells[fromColIdx];

                // SCAMBIO LOGICO SULLA GRIGLIA
                // Quello che io sposto (es. 5E Sabato) va nella cella di arrivo (Venerdì IV)
                // Quello che era nella cella di arrivo (Bressanelli Venerdì IV) va nella cella simmetrica
                // del collega nel momento in cui io ero impegnato (Sabato III)
                
                let tempSorgente = draggedElement.innerHTML;
                let tempDestinazione = this.innerHTML;

                this.innerHTML = tempSorgente; // Metto la mia ora al collega
                draggedElement.innerHTML = ""; // Svuoto la mia vecchia posizione
                
                // La classe che c'era prima al venerdì (Bressanelli) torna al sabato del mio blocco? 
                // No, deve andare al Sabato del blocco Bressanelli.
                cellaSimmetricaDelCollega.innerHTML = tempDestinazione;
            });
        });
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
        const table = document.getElementById('mainTable');
        const ws = XLSX.utils.table_to_sheet(table);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Orario_Scambiato");
        XLSX.writeFile(wb, "orario_simmetrico.xlsx");
    });
</script>
</body>
</html>
