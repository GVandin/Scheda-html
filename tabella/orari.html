<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Scambio Orario Intelligente - Ricerca Collega</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .controls { text-align: center; margin-bottom: 20px; }
        table { border-collapse: collapse; margin: auto; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        td, th { border: 1px solid #ccc; width: 110px; height: 45px; text-align: center; font-size: 12px; }
        th { background: #2c3e50; color: white; }
        .docente-row { background: #e8f6f3; font-weight: bold; }
        .slot { cursor: grab; }
        .drag-over { background: #fff9c4 !important; border: 2px solid #f1c40f; }
        button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="fileInput" accept=".xlsx, .xls" />
    <button id="exportBtn" style="display:none;">💾 Esporta Excel Aggiornato</button>
</div>
<div id="tableContainer"></div>

<script>
    let draggedElement = null;
    const ORE = 6; // Numero di ore per ogni blocco docente

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
            renderTable(jsonData);
        };
        reader.readAsArrayBuffer(file);
    });

    function renderTable(data) {
        let html = '<table id="orarioTable"><thead><tr><th>Docente</th><th>Ora</th><th>Lun</th><th>Mar</th><th>Mer</th><th>Gio</th><th>Ven</th><th>Sab</th></tr></thead><tbody>';
        data.forEach((row, rIdx) => {
            if (rIdx === 0) return;
            html += `<tr data-r="${rIdx}">`;
            for (let cIdx = 0; cIdx < 8; cIdx++) {
                let val = row[cIdx] || "";
                let isSlot = cIdx >= 2;
                let classes = isSlot ? "slot" : (cIdx === 0 && val !== "" ? "docente-row" : "");
                html += `<td class="${classes}" ${isSlot ? 'draggable="true"' : ''} data-c="${cIdx}">${val === "" ? "&nbsp;" : val}</td>`;
            }
            html += '</tr>';
        });
        document.getElementById('tableContainer').innerHTML = html + '</tbody></table>';
        document.getElementById('exportBtn').style.display = 'inline-block';
        initDragDrop();
    }

    function initDragDrop() {
        const slots = document.querySelectorAll('.slot');
        const table = document.getElementById('orarioTable');

        slots.forEach(slot => {
            slot.addEventListener('dragstart', (e) => {
                draggedElement = slot;
                slot.style.opacity = '0.4';
            });

            slot.addEventListener('dragend', () => {
                slot.style.opacity = '1';
                slots.forEach(s => s.classList.remove('drag-over'));
            });

            slot.addEventListener('dragover', e => e.preventDefault());
            slot.addEventListener('dragenter', () => slot.classList.add('drag-over'));
            slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));

            slot.addEventListener('drop', function(e) {
                e.preventDefault();
                if (draggedElement === this) return;

                const rPartenza = draggedElement.parentElement.rowIndex;
                const cPartenza = parseInt(draggedElement.dataset.c);
                const rArrivo = this.parentElement.rowIndex;
                const cArrivo = parseInt(this.dataset.c);

                const classeSpostata = draggedElement.innerText.trim();
                if (!classeSpostata || classeSpostata === "") return;

                // 1. Sposto la MIA classe nel MIO nuovo slot
                this.innerHTML = classeSpostata;
                draggedElement.innerHTML = "&nbsp;";

                // 2. CERCO CHI ALTRO AVEVA QUELLA CLASSE IN QUEL MOMENTO
                // Calcoliamo l'ora relativa (es. 1ª, 2ª...) per trovare la corrispondenza
                const oraRelativaPartenza = (rPartenza - 1) % ORE;
                const oraRelativaArrivo = (rArrivo - 1) % ORE;

                for (let i = 1; i < table.rows.length; i++) {
                    let rigaAttuale = table.rows[i];
                    let cellaCorrente = rigaAttuale.cells[cArrivo];

                    // Se trovo la stessa classe in una sottotabella che NON è la mia
                    // (Controllo che la riga non appartenga al mio blocco docente)
                    const mioBloccoInizio = Math.floor((rPartenza - 1) / ORE) * ORE + 1;
                    const suoBloccoInizio = Math.floor((i - 1) / ORE) * ORE + 1;

                    if (mioBloccoInizio !== suoBloccoInizio && cellaCorrente.innerText.trim() === classeSpostata) {
                        
                        // 3. SPOSTO L'ORA DEL COLLEGA
                        // La sua ora si sposta dalla posizione di arrivo (cArrivo) 
                        // alla posizione di partenza corrispondente (cPartenza) nel SUO blocco
                        let cellaDestinazioneCollega = table.rows[suoBloccoInizio + oraRelativaPartenza].cells[cPartenza];
                        
                        cellaDestinazioneCollega.innerHTML = classeSpostata;
                        cellaCorrente.innerHTML = "&nbsp;";
                        
                        console.log("Scambio effettuato con il collega al blocco riga: " + suoBloccoInizio);
                        break; // Trovato il collega, esco dal ciclo
                    }
                }
            });
        });
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
        const table = document.getElementById('orarioTable');
        const ws = XLSX.utils.table_to_sheet(table);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Orario_Aggiornato");
        XLSX.writeFile(wb, "orario_scambio_classi.xlsx");
    });
</script>
</body>
</html>
