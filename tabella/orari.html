<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Orario Scolastico - Controllo Rigido</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eceff1; padding: 20px; }
        .toolbar { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; margin-bottom: 20px; }
        button { padding: 12px 24px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-solve { background: #6200ea; color: white; }
        .btn-export { background: #2e7d32; color: white; }
        table { border-collapse: collapse; margin: 20px auto; background: white; border: 2px solid #263238; }
        td { border: 1px solid #cfd8dc; width: 95px; height: 40px; text-align: center; font-size: 12px; }
        .slot { cursor: grab; background: #fff; }
        .docente-start { border-top: 3px solid #263238 !important; background: #f1f8e9; font-weight: bold; }
        .drag-over { background: #fff59d !important; border: 2px solid #fbc02d; }
        #log { max-width: 900px; margin: 10px auto; background: #263238; color: #ffab91; padding: 15px; border-radius: 5px; font-family: monospace; height: 100px; overflow-y: auto; }
        .log-success { color: #81c784; }
    </style>
</head>
<body>

<div class="toolbar">
    <h2>Gestione Orario Protetto</h2>
    <input type="file" id="fileInput" accept=".xlsx, .xls" /><br><br>
    <button id="solveBtn" class="btn-solve">🚀 Tenta Automazione Sabato</button>
    <button id="exportBtn" class="btn-export">💾 Scarica Excel</button>
</div>

<div id="log">Sistema pronto. Carica il file...</div>
<div id="tableContainer"></div>

<script>
    let draggedElement = null;
    const ORE = 6; 
    const COL_SABATO = 7;

    function log(msg, isError = true) {
        const l = document.getElementById('log');
        const colorClass = isError ? "" : "log-success";
        l.innerHTML = `> <span class="${colorClass}">${msg}</span><br>` + l.innerHTML;
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: "" });
            renderTable(jsonData);
            log("File caricato.", false);
        };
        reader.readAsArrayBuffer(file);
    });

    function renderTable(data) {
        let html = '<table id="orarioTable"><tbody>';
        data.forEach((row, rIdx) => {
            html += `<tr>`;
            for (let cIdx = 0; cIdx < 8; cIdx++) {
                let val = String(row[cIdx] || "").trim();
                let isSlot = cIdx >= 2;
                let cellClass = (rIdx % ORE === 0) ? "docente-start " : "";
                if (isSlot) cellClass += "slot";
                html += `<td class="${cellClass}" ${isSlot ? 'draggable="true"' : ''} data-col="${cIdx}">${val === "" ? "&nbsp;" : val}</td>`;
            }
            html += '</tr>';
        });
        document.getElementById('tableContainer').innerHTML = html + '</tbody></table>';
        initDragDrop();
    }

    function initDragDrop() {
        const slots = document.querySelectorAll('.slot');
        slots.forEach(slot => {
            slot.addEventListener('dragstart', (e) => { draggedElement = slot; });
            slot.addEventListener('dragover', e => e.preventDefault());
            slot.addEventListener('dragenter', () => slot.classList.add('drag-over'));
            slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
            slot.addEventListener('drop', function(e) {
                e.preventDefault();
                slot.classList.remove('drag-over');
                effettuaScambioLecito(draggedElement, this);
            });
        });
    }

    function effettuaScambioLecito(cellaPartenza, cellaArrivo) {
        const table = document.getElementById('orarioTable');
        const rStart = cellaPartenza.parentElement.rowIndex;
        const cStart = parseInt(cellaPartenza.dataset.col);
        const rEnd = cellaArrivo.parentElement.rowIndex;
        const cEnd = parseInt(cellaArrivo.dataset.col);
        const classe = cellaPartenza.innerText.trim();

        if (classe === "" || classe === " ") return;

        const mioBloccoInizio = Math.floor(rStart / ORE) * ORE;
        const oraRelativa = rStart % ORE;

        // 1. Cerca chi ha la classe nello slot di destinazione
        let infoCollega = trovaCollegaConClasse(classe, rEnd, cEnd, mioBloccoInizio);

        if (!infoCollega) {
            alert("ERRORE: Nessun collega trovato per coprire la " + classe + " in questo slot.");
            return;
        }

        // 2. Verifica se il collega può scambiare (Giorno Libero e Cella Vuota al sabato/slot partenza)
        let rigaSpecchioCollega = infoCollega.suoBloccoInizio + oraRelativa;
        let cellaSpecchioCollega = table.rows[rigaSpecchioCollega].cells[cStart];
        
        let validazione = validaSpostamentoCollega(infoCollega.suoBloccoInizio, cStart, cellaSpecchioCollega, infoCollega.nomeDocente);

        if (validazione.ok) {
            // ESECUZIONE
            cellaArrivo.innerHTML = classe;
            cellaPartenza.innerHTML = "&nbsp;";
            cellaSpecchioCollega.innerHTML = classe;
            infoCollega.cellaAttuale.innerHTML = "&nbsp;";
            log(`SCAMBIO OK: ${classe} spostata. Turno scambiato con ${infoCollega.nomeDocente}`, false);
        } else {
            alert("AZIONE NEGATA: " + validazione.errore);
            log("NEGATO: " + validazione.errore);
        }
    }

    function trovaCollegaConClasse(classe, r, c, mioInizio) {
        const table = document.getElementById('orarioTable');
        for (let i = 0; i < table.rows.length; i++) {
            let inizio = Math.floor(i / ORE) * ORE;
            if (inizio !== mioInizio && table.rows[i].cells[c].innerText.trim() === classe) {
                // Preleviamo il nome del docente (cella 0 della riga inizio blocco)
                let nome = table.rows[inizio].cells[0].innerText.trim();
                return { suoBloccoInizio: inizio, cellaAttuale: table.rows[i].cells[c], nomeDocente: nome };
            }
        }
        return null;
    }

    function validaSpostamentoCollega(inizioBlocco, col, cellaTarget, nomeDocente) {
        const table = document.getElementById('orarioTable');
        
        // Controllo Giorno Libero: il collega ha altre ore in questo giorno (col)?
        let haAltreOre = false;
        for (let i = 0; i < ORE; i++) {
            let contenuto = table.rows[inizioBlocco + i].cells[col].innerText.trim();
            if (contenuto !== "" && contenuto !== " ") haAltreOre = true;
        }

        if (!haAltreOre) {
            return { ok: false, errore: `Il docente ${nomeDocente} ha giorno libero il ${getGiornoNome(col)}.` };
        }

        // Controllo Cella Occupata: la cella dove il collega deve andare è già presa?
        let contTarget = cellaTarget.innerText.trim();
        if (contTarget !== "" && contTarget !== " ") {
            return { ok: false, errore: `Lo slot del docente ${nomeDocente} è già occupato da ${contTarget}.` };
        }

        return { ok: true };
    }

    function getGiornoNome(col) {
        const giorni = ["", "", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
        return giorni[col];
    }

    // (Logica SolveBtn e ExportBtn rimangono uguali ma usano le nuove funzioni di validazione)
</script>
</body>
</html>
