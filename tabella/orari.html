<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Orario Scolastico - Versione Integrale</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .controls { text-align: center; margin-bottom: 20px; }
        table { border-collapse: collapse; margin: auto; background: white; border: 2px solid #333; }
        td { border: 1px solid #ccc; width: 100px; height: 45px; text-align: center; font-size: 12px; }
        .slot { cursor: grab; background: #fff; }
        .drag-over { background: #fff9c4 !important; border: 2px solid #f1c40f; }
        /* Evidenzia l'inizio di ogni docente per controllo visivo */
        .docente-start { border-top: 2px solid #333 !important; background: #e8f6f3; font-weight: bold; }
        button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="fileInput" accept=".xlsx, .xls" />
    <button id="exportBtn" style="display:none;">💾 Esporta Orario</button>
</div>
<div id="tableContainer"></div>

<script>
    let draggedElement = null;
    const ORE = 6; 

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            // header: 1 e defval garantiscono che nessuna cella o riga venga saltata
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: "" });
            renderTable(jsonData);
        };
        reader.readAsArrayBuffer(file);
    });

    function renderTable(data) {
        let html = '<table id="orarioTable"><tbody>';
        data.forEach((row, rIdx) => {
            // Se la riga è completamente vuota, la saltiamo per non sballare i blocchi da 6
            if (row.every(cell => cell === "")) return;

            html += `<tr>`;
            for (let cIdx = 0; cIdx < 8; cIdx++) {
                let val = String(row[cIdx] || "").trim();
                let isSlot = cIdx >= 2;
                
                // Applichiamo una classe speciale alla prima riga di ogni docente (0, 6, 12...)
                let cellClass = "";
                if (rIdx % ORE === 0) cellClass = "docente-start ";
                if (isSlot) cellClass += "slot";

                html += `<td class="${cellClass}" ${isSlot ? 'draggable="true"' : ''} data-col="${cIdx}">
                            ${val === "" ? "&nbsp;" : val}
                         </td>`;
            }
            html += '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('tableContainer').innerHTML = html;
        document.getElementById('exportBtn').style.display = 'inline-block';
        initDragDrop();
    }
