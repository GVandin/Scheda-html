<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestore Orario - Scambio Protetto</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eceff1; padding: 20px; }
        .toolbar { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        button { padding: 12px 24px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-solve { background: #6200ea; color: white; }
        .btn-export { background: #2e7d32; color: white; }
        table { border-collapse: collapse; margin: 20px auto; background: white; border: 2px solid #263238; }
        td { border: 1px solid #cfd8dc; width: 95px; height: 40px; text-align: center; font-size: 12px; }
        .docente-start { border-top: 3px solid #263238 !important; background: #f1f8e9; font-weight: bold; }
        #log { max-width: 900px; margin: 10px auto; background: #263238; color: #81c784; padding: 15px; border-radius: 5px; font-family: monospace; height: 120px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="toolbar">
    <h2>Pannello di Controllo Orario</h2>
    <input type="file" id="fileInput" accept=".xlsx, .xls" /><br><br>
    <button id="solveBtn" class="btn-solve">🚀 Tenta Permutazioni per Sabato (Copertura Obbligatoria)</button>
    <button id="exportBtn" class="btn-export">💾 Scarica Excel</button>
</div>

<div id="log">Carica il file per iniziare...</div>
<div id="tableContainer"></div>

<script>
    let draggedElement = null;
    const ORE = 6; 
    const COL_SABATO = 7;

    function log(msg) {
        const l = document.getElementById('log');
        l.innerHTML = `> ${msg}<br>` + l.innerHTML;
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: "" });
            renderTable(jsonData);
            log("File pronto.");
        };
        reader.readAsArrayBuffer(file);
    });

    function renderTable(data) {
        let html = '<table id="orarioTable"><tbody>';
        data.forEach((row, rIdx) => {
            html += `<tr>`;
            for (let cIdx = 0; cIdx < 8; cIdx++) {
                let val = String(row[cIdx] || "").trim();
                let cellClass = (rIdx % ORE === 0) ? "docente-start " : "";
                html += `<td class="${cellClass}" data-col="${cIdx}">${val === "" ? "&nbsp;" : val}</td>`;
            }
            html += '</tr>';
        });
        document.getElementById('tableContainer').innerHTML = html + '</tbody></table>';
    }

    document.getElementById('solveBtn').addEventListener('click', () => {
        const table = document.getElementById('orarioTable');
        if (!table) return;

        log("Analisi sabato 4ª-6ª ora...");
        let risolte = 0;

        // Iteriamo sulle tue ore del sabato (riga 3, 4, 5 del primo blocco)
        for (let rPartenza = 3; rPartenza <= 5; rPartenza++) {
            let classe = table.rows[rPartenza].cells[COL_SABATO].innerText.trim();
            if (classe === "" || classe === " ") continue;

            let successo = false;
            // Cerchiamo un buco nel tuo orario (LUN-VEN)
            for (let cArrivo = 2; cArrivo <= 6; cArrivo++) {
                for (let rOffset = 0; rOffset < ORE; rOffset++) {
                    if (successo) break;

                    let rArrivo = rOffset;
                    let cellaDestMIA = table.rows[rArrivo].cells[cArrivo];

                    // Se io ho un buco libero in quel momento
                    if (cellaDestMIA.innerText.trim() === "" || cellaDestMIA.innerText.trim() === " ") {
                        
                        // ORA IL CONTROLLO CRITICO: Chi ha la classe in quel momento?
                        let infoCollega = trovaCollegaConClasse(classe, rArrivo, cArrivo);

                        if (infoCollega) {
                            // Verifichiamo se il collega può "venire" al sabato al mio posto
                            let rigaSpecchioCollega = infoCollega.suoBloccoInizio + (rPartenza % ORE);
                            let cellaSpecchioCollega = table.rows[rigaSpecchioCollega].cells[COL_SABATO];

                            // Verifichiamo Giorno Libero e Occupazione
                            if (puoRicevereOra(infoCollega.suoBloccoInizio, COL_SABATO, cellaSpecchioCollega)) {
                                // ESEGUIAMO LO SCAMBIO INCROCIATO
                                cellaDestMIA.innerHTML = classe;
                                table.rows[rPartenza].cells[COL_SABATO].innerHTML = "&nbsp;";
                                
                                cellaSpecchioCollega.innerHTML = classe;
                                infoCollega.cellaAttuale.innerHTML = "&nbsp;";
                                
                                log(`OK: ${classe} spostata. Scambiato turno con docente al blocco ${infoCollega.suoBloccoInizio/ORE + 1}`);
                                successo = true;
                                risolte++;
                            }
                        }
                    }
                }
            }
        }
        log(`Finito. Ore sabato liberate: ${risolte}`);
    });

    function trovaCollegaConClasse(classe, riga, col) {
        const table = document.getElementById('orarioTable');
        // Saltiamo il primo blocco (il tuo)
        for (let i = ORE; i < table.rows.length; i++) {
            if (table.rows[i].cells[col].innerText.trim() === classe) {
                return {
                    suoBloccoInizio: Math.floor(i / ORE) * ORE,
                    cellaAttuale: table.rows[i].cells[col]
                };
            }
        }
        return null;
    }

    function puoRicevereOra(inizioBlocco, col, cellaTarget) {
        const table = document.getElementById('orarioTable');
        // 1. Non deve essere il suo giorno libero
        let haOreQuelGiorno = false;
        for (let i = 0; i < ORE; i++) {
            if (table.rows[inizioBlocco + i].cells[col].innerText.trim() !== "" && 
                table.rows[inizioBlocco + i].cells[col].innerText.trim() !== " ") {
                haOreQuelGiorno = true;
            }
        }
        if (!haOreQuelGiorno) return false;

        // 2. La cella deve essere vuota
        let contenuto = cellaTarget.innerText.trim();
        return (contenuto === "" || contenuto === " ");
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
        const ws = XLSX.utils.table_to_sheet(document.getElementById('orarioTable'));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Orario_Bilanciato");
        XLSX.writeFile(wb, "orario_risolto.xlsx");
    });
</script>
</body>
</html>
